<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  
  <link rel="icon" type="image/png" href="https://4photoshop.ir/wp-content/uploads/4photoshop-icon-car-%D8%A2%DB%8C%DA%A9%D9%88%D9%86-%D9%85%D8%A7%D8%B4%DB%8C%D9%86.jpg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101826">
<title>تارا | روزشمار تحویل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101826;
    --bg-deep: #0B121D;
    --grid: rgba(200, 150, 100, 0.07);
    --grid-strong: rgba(200, 150, 100, 0.14);
    --brass: #C89664;
    --brass-bright: #E0B183;
    --ivory: #F4EFE6;
    --ivory-dim: #A9A08F;
    --rose: #8B6F5C;
    --line: #24344A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background:
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--ivory);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 28px 18px 40px;
    position:relative;
    overflow-x:hidden;
  }
  /* blueprint grid background */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 34px 34px;
    z-index:0;
    animation: gridIn 1.6s ease-out;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse at 50% 15%, rgba(200,150,100,0.10), transparent 60%);
    z-index:0;
    pointer-events:none;
  }
  @keyframes gridIn{
    from{ opacity:0; background-size: 60px 60px; }
    to{ opacity:1; background-size: 34px 34px; }
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    letter-spacing:1px;
    color:var(--brass);
    margin-bottom:6px;
    opacity:0;
    animation: fadeUp .7s ease-out .1s forwards;
  }
  .eyebrow .dash{ width:22px; height:1px; background:var(--brass); opacity:.6; }

  .project-name{
    font-size:44px;
    font-weight:900;
    color:var(--ivory);
    letter-spacing:1px;
    margin-bottom:2px;
    opacity:0;
    animation: fadeUp .7s ease-out .18s forwards;
  }
  .project-name span{ color:var(--brass-bright); }

  .subtitle{
    font-size:14.5px;
    color: var(--ivory-dim);
    margin-bottom:34px;
    opacity:0;
    animation: fadeUp .7s ease-out .26s forwards;
  }

  .done-banner{
    display:none;
    background: linear-gradient(135deg, rgba(200,150,100,.18), rgba(200,150,100,.05));
    border:1px solid var(--brass);
    border-radius:14px;
    padding:22px;
    font-size:20px;
    font-weight:700;
    color: var(--brass-bright);
    margin-bottom:20px;
  }

  .counters{
    width:100%;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    opacity:0;
    animation: fadeUp .7s ease-out .34s forwards;
  }
  .counters.five{ grid-template-columns: repeat(3,1fr); }
  .unit{
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 6px 12px;
    position:relative;
  }
  .unit::before{
    content:"";
    position:absolute;
    top:0; right:14px; left:14px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    opacity:.5;
  }
  .unit .num{
    font-size:34px;
    font-weight:800;
    color:var(--ivory);
    font-variant-numeric: tabular-nums;
    line-height:1.1;
  }
  .unit.small .num{ font-size:26px; }
  .unit .lbl{
    font-size:11.5px;
    color:var(--ivory-dim);
    margin-top:4px;
    letter-spacing:.5px;
  }
  .row2{
    width:100%;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    margin-top:10px;
  }

  /* the ruler / timeline signature element */
  .ruler-wrap{
    width:100%;
    margin-top:36px;
    opacity:0;
    animation: fadeUp .7s ease-out .42s forwards;
  }
  .ruler-caption{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--ivory-dim);
    margin-bottom:8px;
    letter-spacing:.3px;
  }
  .ruler{
    position:relative;
    width:100%;
    height:64px;
  }
  .ruler .track{
    position:absolute;
    top:28px; left:0; right:0;
    height:2px;
    background: var(--line);
  }
  .ruler .fill{
    position:absolute;
    top:28px; right:0;
    height:2px;
    background: linear-gradient(90deg, var(--brass), var(--brass-bright));
  }
  .tick{
    position:absolute;
    top:0;
    transform: translateX(50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:10px;
    color:var(--ivory-dim);
  }
  .tick .mark{
    width:1px; height:14px;
    background: var(--line);
    margin-bottom:6px;
  }
  .tick.now .mark{ background: var(--brass-bright); height:20px; width:2px; }
  .tick.now .label{ color: var(--brass-bright); font-weight:700; }
  .tick.target .mark{ background: var(--brass-bright); height:20px; width:2px; }
  .tick.target .label{ color: var(--brass-bright); font-weight:700; }
  .pin{
    position:absolute;
    top:22px;
    width:12px; height:12px;
    border-radius:50%;
    background: var(--brass-bright);
    box-shadow: 0 0 0 4px rgba(224,177,131,0.18), 0 0 14px rgba(224,177,131,0.5);
    transform: translateX(50%);
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 4px rgba(224,177,131,0.18), 0 0 14px rgba(224,177,131,0.5); }
    50%{ box-shadow: 0 0 0 7px rgba(224,177,131,0.10), 0 0 20px rgba(224,177,131,0.7); }
  }

  .footer-date{
    margin-top:34px;
    font-size:12.5px;
    color: var(--ivory-dim);
    opacity:0;
    animation: fadeUp .7s ease-out .5s forwards;
    line-height:1.9;
  }
  .footer-date b{ color: var(--brass); font-weight:600; }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; }
  }

  a:focus-visible, button:focus-visible{ outline: 2px solid var(--brass-bright); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow"><span class="dash"></span> پروژه تارا <span class="dash"></span></div>
  <div class="project-name">روزشمار <span>تحویل</span></div>
  <div class="subtitle" id="todayLine">امروز …</div>

  <div class="done-banner" id="doneBanner">🔑 تحویل تارا فرارسید!</div>

  <div class="counters" id="counters">
    <div class="unit">
      <div class="num" id="valMonths">–</div>
      <div class="lbl">ماه</div>
    </div>
    <div class="unit">
      <div class="num" id="valDays">–</div>
      <div class="lbl">روز</div>
    </div>
    <div class="unit">
      <div class="num" id="valHours">–</div>
      <div class="lbl">ساعت</div>
    </div>
  </div>
  <div class="row2">
    <div class="unit small">
      <div class="num" id="valMinutes">–</div>
      <div class="lbl">دقیقه</div>
    </div>
    <div class="unit small">
      <div class="num" id="valSeconds">–</div>
      <div class="lbl">ثانیه</div>
    </div>
  </div>

  <div class="ruler-wrap">
    <div class="ruler-caption"><span>امروز</span><span>تحویل تارا</span></div>
    <div class="ruler" id="ruler">
      <div class="track"></div>
      <div class="fill" id="rulerFill"></div>
    </div>
  </div>

  <div class="footer-date">
    تاریخ تحویل: <b>۳۱ تیر ۱۴۰۶</b>
  </div>

</div>

<script>
/* ---------- Jalali <-> Gregorian conversion (jalaali algorithm) ---------- */
function div(a,b){ return ~~(a/b); }
function mod(a,b){ return a - ~~(a/b)*b; }

var breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];

function jalCal(jy){
  var bl = breaks.length, gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump, leap, leapG, march, n, i;
  for (i = 1; i < bl; i += 1) {
    jm = breaks[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump, 33) * 33;
  leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap: leap, gy: gy, march: march };
}

function g2d(gy, gm, gd){
  var d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) +
      div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}

function d2g(jdn){
  var j, i, gd, gm, gy;
  j = 4 * jdn + 139361631;
  j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  i = div(mod(j, 1461), 4) * 5 + 308;
  gd = div(mod(i, 153), 5) + 1;
  gm = mod(div(i, 153), 12) + 1;
  gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return { gy: gy, gm: gm, gd: gd };
}

function j2d(jy, jm, jd){
  var r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}

function d2j(jdn){
  var gy = d2g(jdn).gy, jy = gy - 621, r = jalCal(jy), jdn1f = g2d(gy, 3, r.march), jd, jm, k;
  k = jdn - jdn1f;
  if (k >= 0) {
    if (k <= 185) {
      jm = 1 + div(k, 31);
      jd = mod(k, 31) + 1;
      return { jy: jy, jm: jm, jd: jd };
    } else {
      k -= 186;
    }
  } else {
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + div(k, 30);
  jd = mod(k, 30) + 1;
  return { jy: jy, jm: jm, jd: jd };
}

function toJalaali(gy, gm, gd){ return d2j(g2d(gy, gm, gd)); }
function toGregorian(jy, jm, jd){ return d2g(j2d(jy, jm, jd)); }

function isLeapJalaaliYear(jy){ return jalCal(jy).leap === 0; }

function jalaaliMonthLength(jy, jm){
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaaliYear(jy) ? 30 : 29;
}

function addDaysToJalali(jy, jm, jd, days){
  var g = toGregorian(jy, jm, jd);
  var dt = new Date(g.gy, g.gm - 1, g.gd);
  dt.setDate(dt.getDate() + days);
  return toJalaali(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
}

function jalaliDateDiff(y1,m1,d1, y2,m2,d2){
  var months = (y2 - y1) * 12 + (m2 - m1);
  var days = d2 - d1;
  if (days < 0){
    months -= 1;
    var pm = m2 - 1, py = y2;
    if (pm === 0){ pm = 12; py = y2 - 1; }
    days += jalaaliMonthLength(py, pm);
  }
  return { months: months, days: days };
}

/* ---------- target ---------- */
var TARGET_JY = 1406, TARGET_JM = 4, TARGET_JD = 31;
var monthNames = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
var weekdayNames = ["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];

function toFa(n){
  var faDigits = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  return String(n).replace(/[0-9]/g, function(d){ return faDigits[d]; });
}

var targetG = toGregorian(TARGET_JY, TARGET_JM, TARGET_JD);
var targetDate = new Date(targetG.gy, targetG.gm - 1, targetG.gd, 0, 0, 0, 0);

function render(){
  var now = new Date();
  var nowJ = toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());

  document.getElementById('todayLine').textContent =
    weekdayNames[now.getDay()] + ' ' + toFa(nowJ.jd) + ' ' + monthNames[nowJ.jm - 1] + ' ' + toFa(nowJ.jy);

  var diffMs = targetDate.getTime() - now.getTime();

  if (diffMs <= 0){
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('counters').style.display = 'none';
    document.querySelector('.row2').style.display = 'none';
    document.getElementById('valMonths').textContent = toFa(0);
    document.getElementById('rulerFill').style.width = '100%';
    return;
  }

  var totalSeconds = Math.floor(diffMs / 1000);
  var wholeDays = Math.floor(totalSeconds / 86400);
  var remSeconds = totalSeconds - wholeDays * 86400;
  var hours = Math.floor(remSeconds / 3600);
  var minutes = Math.floor((remSeconds % 3600) / 60);
  var seconds = remSeconds % 60;

  var mid = addDaysToJalali(nowJ.jy, nowJ.jm, nowJ.jd, wholeDays);
  var diff = jalaliDateDiff(nowJ.jy, nowJ.jm, nowJ.jd, mid.jy, mid.jm, mid.jd);

  document.getElementById('valMonths').textContent = toFa(diff.months);
  document.getElementById('valDays').textContent = toFa(diff.days);
  document.getElementById('valHours').textContent = toFa(hours);
  document.getElementById('valMinutes').textContent = toFa(minutes);
  document.getElementById('valSeconds').textContent = toFa(seconds);

  /* ruler fill: proportion of remaining time, referenced against a 12-month max window for visual scale */
  var totalMonthsMax = 12;
  var remainingMonthsApprox = diff.months + diff.days / 30;
  var pct = Math.max(2, Math.min(100, (1 - remainingMonthsApprox / totalMonthsMax) * 100));
  document.getElementById('rulerFill').style.width = pct + '%';
  buildTicks(nowJ, diff.months);
}

function buildTicks(nowJ, monthsRemaining){
  var ruler = document.getElementById('ruler');
  var old = ruler.querySelectorAll('.tick, .pin');
  old.forEach(function(el){ el.remove(); });

  var count = Math.min(monthsRemaining + 1, 12);
  var span = ruler.getBoundingClientRect().width || 400;

  for (var i = 0; i <= count; i++){
    var m = nowJ.jm - 1 + i;
    var y = nowJ.jy;
    while (m >= 12){ m -= 12; y += 1; }
    var pctPos = (i / count) * 100;
    var tick = document.createElement('div');
    tick.className = 'tick';
    if (i === 0) tick.className += ' now';
    if (i === count) tick.className += ' target';
    tick.style.right = pctPos + '%';
    tick.innerHTML = '<div class="mark"></div><div class="label">' + monthNames[m] + '</div>';
    ruler.appendChild(tick);
  }

  var pin = document.createElement('div');
  pin.className = 'pin';
  pin.style.right = '0%';
  ruler.appendChild(pin);
}

render();
setInterval(render, 1000);
</script>
</body>
</html>
